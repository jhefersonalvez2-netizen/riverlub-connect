name: Connect CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Connect UI
        run: |
          npm ci
          npm run build:ui
          npm audit --omit=dev --audit-level=high
      - name: Validate bundled WhatsApp agent
        run: |
          npm install --package-lock-only --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          node vendor/whatsapp-agent/patches/apply-media-id-fix.cjs
          node --check vendor/whatsapp-agent/src/index.js
          npm audit --omit=dev --json --prefix vendor/whatsapp-agent > /tmp/agent-audit.json || true
      - name: Enforce agent security policy
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/agent-audit.json').read_text(encoding='utf-8'))
          vulns = data.get('vulnerabilities', {}) or {}
          rank = {'info': 0, 'low': 1, 'moderate': 2, 'high': 3, 'critical': 4}
          # extract-zip is reachable only through Puppeteer's browser-download path.
          # Release installs use --ignore-scripts and RiverLub uses the machine's Chrome/Edge.
          allowed_urls = {
              'https://github.com/advisories/GHSA-jmr9-qjv8-65gv',
              'https://github.com/advisories/GHSA-7pqw-9j4j-h8q3',
          }

          def advisories(name, seen=None):
              seen = set() if seen is None else set(seen)
              if name in seen:
                  return [], []
              seen.add(name)
              vuln = vulns.get(name) or {}
              found, unknown = [], []
              for via in vuln.get('via', []) or []:
                  if isinstance(via, dict):
                      if rank.get(str(via.get('severity', '')).lower(), 0) >= 3:
                          found.append(via)
                  elif isinstance(via, str):
                      if via in vulns:
                          nested, missing = advisories(via, seen)
                          found.extend(nested)
                          unknown.extend(missing)
                      else:
                          unknown.append(via)
              return found, unknown

          unexpected = []
          for name, vuln in vulns.items():
              if rank.get(str(vuln.get('severity', '')).lower(), 0) < 3:
                  continue
              found, unknown = advisories(name)
              urls = {str(item.get('url') or '').strip() for item in found if item.get('url')}
              if unknown or not urls or not urls.issubset(allowed_urls):
                  unexpected.append({'name': name, 'urls': sorted(urls), 'unknown': unknown})

          if unexpected:
              raise SystemExit(f'Unexpected high/critical agent advisories: {unexpected}')
          print('No unexpected high/critical agent advisories.')

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Prepare bundled Node runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force vendor/node | Out-Null
          Copy-Item (Get-Command node.exe).Source vendor/node/node.exe -Force
      - name: Prepare WhatsApp agent runtime
        run: |
          npm install --package-lock-only --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          node vendor/whatsapp-agent/patches/apply-media-id-fix.cjs
      - name: Smoke test bundled WhatsApp agent startup
        shell: pwsh
        run: ./scripts/smoke-whatsapp-agent.ps1
      - name: Build Windows installer
        run: npm run tauri:build
