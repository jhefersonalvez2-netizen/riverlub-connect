name: Connect CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Connect UI
        run: |
          npm ci
          npm run build:ui
          npm audit --omit=dev --audit-level=high
      - name: Validate bundled WhatsApp agent
        run: |
          npm audit fix --package-lock-only --omit=dev --prefix vendor/whatsapp-agent
          npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          node vendor/whatsapp-agent/patches/apply-media-id-fix.cjs
          node --check vendor/whatsapp-agent/src/index.js
          npm audit --omit=dev --audit-level=high --prefix vendor/whatsapp-agent

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Prepare bundled Node runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force vendor/node | Out-Null
          Copy-Item (Get-Command node.exe).Source vendor/node/node.exe -Force
      - name: Prepare WhatsApp agent runtime
        run: |
          npm audit fix --package-lock-only --omit=dev --prefix vendor/whatsapp-agent
          npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          node vendor/whatsapp-agent/patches/apply-media-id-fix.cjs
          npm audit --omit=dev --audit-level=high --prefix vendor/whatsapp-agent
      - name: Build Windows installer
        run: npm run tauri:build
