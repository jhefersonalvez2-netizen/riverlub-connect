name: Apply Connect v0.4 lifecycle hardening

on:
  push:
    branches:
      - feat/connect-0.4-lifecycle-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.4-applied]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/connect-0.4-lifecycle-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply v0.4 architecture
        run: python scripts/apply_v040.py

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Install Connect dependencies
        run: npm ci

      - name: Prepare bundled Node runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force vendor/node | Out-Null
          Copy-Item (Get-Command node.exe).Source vendor/node/node.exe -Force

      - name: Install bundled WhatsApp runtime
        run: npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent

      - name: Apply bundled WhatsApp patch
        run: node vendor/whatsapp-agent/patches/apply-media-id-fix.cjs

      - name: Validate UI and Windows Rust
        shell: powershell
        run: |
          npm run build:ui
          cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build installer smoke test
        run: npm run tauri:build -- --locked

      - name: Commit validated migration
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json src-tauri .github/workflows/ci.yml .github/workflows/release-windows.yml
          if (git diff --cached --quiet) { throw "Nenhuma alteracao gerada" }
          git commit -m "feat: harden Connect lifecycle and runtime v0.4.0 [v0.4-applied]"
          git push origin HEAD:feat/connect-0.4-lifecycle-hardening
