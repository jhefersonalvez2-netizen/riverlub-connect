name: Apply Connect Hardening

on:
  push:
    branches:
      - chore/harden-ci-clean-legacy
    paths:
      - .github/workflows/apply-connect-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/harden-ci-clean-legacy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove obsolete legacy tree
        shell: bash
        run: rm -rf -- "whatsapp riverlub brain"
      - name: Lock and patch bundled WhatsApp agent dependencies
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --prefix vendor/whatsapp-agent
          npm audit fix --package-lock-only --ignore-scripts --prefix vendor/whatsapp-agent
      - name: Validate root application
        shell: bash
        run: |
          npm ci
          npm run build:ui
          npm audit --omit=dev --audit-level=high
      - name: Validate bundled WhatsApp agent
        shell: bash
        run: |
          npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          node --check vendor/whatsapp-agent/src/index.js
          npm audit --omit=dev --audit-level=high --prefix vendor/whatsapp-agent
      - name: Make release installation reproducible
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/release-windows.yml')
          text = path.read_text(encoding='utf-8')
          old = 'run: npm install --omit=dev --prefix vendor/whatsapp-agent'
          new = 'run: npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent'
          if text.count(old) != 1:
              raise SystemExit(f'expected one release install command, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit hardened repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "whatsapp riverlub brain" vendor/whatsapp-agent/package-lock.json .github/workflows/release-windows.yml
          git diff --cached --check
          git commit -m "chore: remove legacy Connect code and lock agent dependencies"
          git push origin HEAD:chore/harden-ci-clean-legacy
