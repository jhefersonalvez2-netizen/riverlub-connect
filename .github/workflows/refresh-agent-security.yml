name: Refresh Connect agent security

on:
  push:
    branches:
      - feat/connect-0.4-lifecycle-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[security-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/connect-0.4-lifecycle-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin patched transitive dependencies
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = 'vendor/whatsapp-agent/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'basic-ftp': '6.2.2',
            'brace-expansion': '2.1.6'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
      - name: Regenerate agent lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix vendor/whatsapp-agent
      - name: Install and verify agent
        run: |
          npm ci --omit=dev --ignore-scripts --prefix vendor/whatsapp-agent
          node vendor/whatsapp-agent/patches/apply-media-id-fix.cjs
          node --check vendor/whatsapp-agent/src/index.js
          node - <<'NODE'
          const path = require('path');
          const base = path.resolve('vendor/whatsapp-agent/node_modules');
          const ftp = require(path.join(base, 'basic-ftp/package.json')).version;
          const brace = require(path.join(base, 'brace-expansion/package.json')).version;
          if (ftp !== '6.2.2') throw new Error(`basic-ftp inesperado: ${ftp}`);
          if (brace !== '2.1.6') throw new Error(`brace-expansion inesperado: ${brace}`);
          console.log(`patched dependencies ok: basic-ftp=${ftp}, brace-expansion=${brace}`);
          NODE
          npm audit --omit=dev --json --prefix vendor/whatsapp-agent > /tmp/audit.json || true
          node - <<'NODE'
          const a=require('/tmp/audit.json');
          for (const [name,v] of Object.entries(a.vulnerabilities||{})) {
            if (!['high','critical'].includes(v.severity)) continue;
            console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable},null,2));
          }
          NODE
      - name: Commit security lock refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/whatsapp-agent/package.json vendor/whatsapp-agent/package-lock.json
          git commit -m "security: refresh patched agent transitive dependencies [security-applied]"
          git push origin HEAD:feat/connect-0.4-lifecycle-hardening
