name: Refresh Agent Lock

on:
  push:
    branches:
      - release/v0.4.0-supervisor

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore: refresh agent security lock') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.4.0-supervisor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh patched transitive dependencies
        run: npm audit fix --package-lock-only --omit=dev --prefix vendor/whatsapp-agent
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- vendor/whatsapp-agent/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/whatsapp-agent/package-lock.json
          git commit -m "chore: refresh agent security lock"
          git push origin HEAD:release/v0.4.0-supervisor
